spring:
  application:
    name: mywatchmate-backend

  # Local secrets go in a .env file at the project root (gitignored, see .env.example).
  # Real environment variables still take precedence.
  config:
    import: optional:file:.env[.properties]

  # Never put real credentials in this file.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mywatchmate}
    username: ${DB_USERNAME:mywatchmate}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities match it.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        hbm2ddl:
          # Lets schema validation see the partitioned chat_messages table.
          extra_physical_table_types: PARTITIONED TABLE

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Redis is for pub/sub and presence, not entity storage
      repositories:
        enabled: false

server:
  # 8080 is taken by a local Apache (httpd) on the dev machine
  port: ${SERVER_PORT:8081}
  # Behind Caddy (staging) the app is reached over plain HTTP; trust Caddy's X-Forwarded-Proto/Host
  # so generated URLs (e.g. Swagger's "Try it out") use https. The app port is never exposed directly.
  forward-headers-strategy: framework

mywatchmate:
  # Frontend origins allowed to call the API and open the WebSocket (comma-separated)
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  jwt:
    # Signing key, at least 32 characters. Set JWT_SECRET in .env; never commit it.
    secret: ${JWT_SECRET:}
    issuer: mywatchmate
    access-ttl: 15m
    refresh-ttl: 30d
  spaces:
    # People (users + guests) allowed in one room at a time
    max-members: ${MAX_MEMBERS_PER_SPACE:50}
    # Where invite links point: <frontend-url>/join/<token>
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
  sessions:
    # Repeating schedules are turned into sessions this many days ahead
    generate-days: 14
    # A live session ends on its own after this when the video's length is unknown
    max-length: 3h
    # ...or this long after a known-length video finishes
    end-grace: 15m
  track:
    # A session counts for someone who watched at least this share of it...
    counted-share: 0.5
    # ...or this long, whichever is less
    counted-cap: 20m
    # Most watch time credited between two attendance checks (they run every 30 s)
    tick-cap: 60s
  invites:
    # Email invitations: addresses per request, and per room per day (we send to whatever is typed)
    max-per-request: 20
    max-per-day: 100
    # Shown as pending this long; the room's link itself keeps working
    lifetime: 14d
    resend-cooldown: 10m
    # Send attempts before an invitation is FAILED, and the wait between them (times the attempts so far)
    max-attempts: 3
    retry-delay: 1m
  give:
    # Where Payaza payment links live (a link must be on one of these, or a subdomain).
    # ASSUMPTION until Payaza confirms their link format; it's settings, not code.
    payaza-hosts: ${PAYAZA_HOSTS:payaza.africa}
    # The AI seeing the same link again within this, in the same session, doesn't re-prompt
    reprompt-window: 10m
    # A Give prompt stays up this long unless a host closes it
    prompt-lifetime: 5m
    # "Looks like a scam" reports from different people that block a link everywhere until reviewed
    report-threshold: 3
    # An opened gift with no result reported after this becomes UNKNOWN
    gift-expiry: 1h
    # The AI worker's X-Service-Token for /api/v1/internal/**; empty turns those endpoints off
    internal-token: ${INTERNAL_CUE_TOKEN:}
  mail:
    # No MAIL_HOST: reminder emails are printed to the log instead of sent
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    from: ${MAIL_FROM:MyWatchMate <no-reply@mywatchmate.com>}
  jobs:
    # Background jobs (sessions, reminders, invitations, attendance, chat partitions); tests turn this off
    enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Keep the pasted token across page reloads while testing
    persist-authorization: true
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      # Redis isn't used until we run more than one instance; enable then.
      enabled: ${REDIS_HEALTH_ENABLED:false}
