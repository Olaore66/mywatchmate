# Test-only overrides, layered on top of src/main/resources/application.yml.
# A fixed signing key so tests don't depend on a developer's .env.
mywatchmate.jwt.secret=test-only-signing-key-that-is-at-least-32-bytes-long
# Background jobs would act on test data at random moments; tests call the jobs directly instead.
mywatchmate.jobs.enabled=false
# Never send real email from tests, even if a developer's .env has MAIL_HOST.
mywatchmate.mail.host=
