# Staging settings shared by the deploy scripts. Nothing secret lives here:
# passwords and keys are generated by setup-staging.sh straight into AWS Parameter Store.

REGION=eu-west-2
NAME=mywatchmate-staging                 # tag on every resource, so they're easy to find and remove
ECR_REPO=mywatchmate-backend
PARAM_PATH=/mywatchmate/staging          # app settings and secrets (Parameter Store)

INSTANCE_TYPE=t3.small                   # 2 GB memory
DB_INSTANCE=mywatchmate-staging
DB_CLASS=db.t4g.micro
DB_ENGINE_MAJOR=17                       # PostgreSQL major version
DB_NAME=mywatchmate
DB_USER=mywatchmate

# Where the frontend runs while the team develops against staging
ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
FRONTEND_URL=http://localhost:3000
